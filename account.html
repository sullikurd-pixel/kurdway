<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KURDWAY Account</title><link rel="stylesheet" href="/admin.css"></head><body><aside><a class="brand" href="/">▲ KURDWAY</a><small>CUSTOMER ACCOUNT</small><a href="/">Explore</a><footer>Founder & Developer<br>Sulli Kurd</footer></aside><main><h1>Your KURDWAY account</h1><section id="login"><h2>Sign in or register</h2><p>Local test only. Use a test address such as hiker@example.com. No actual email is sent.</p><form id="codeform"><label for="email">Email</label><input id="email" type="email" required maxlength="254" autocomplete="email"><button>Request code</button></form><form id="verifyform" hidden><label for="code">Six-digit code</label><input id="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required autocomplete="one-time-code"><button>Verify and sign in</button></form><p id="message" role="status"></p></section><section id="profile" hidden><article><h2>Account overview</h2><p id="address"></p><p id="plan"></p><p>Premium payments are not connected.</p><button id="logout">Sign out</button></article></section></main><script src="/account.js"></script></body></html>
